name: CI/CD validation

on:
  push:
    branches: [MANUS]
  pull_request:
    branches: [MANUS]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Local Python package tests and compilation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[vector,test,agentic]'
      - name: Run deterministic tests
        run: python -m unittest discover -s tests -v
      - name: Compile source and tests
        run: python -m compileall -q src tests scripts

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Run frontend unit and route tests
        run: |
          pnpm --dir frontend test:unit
          pnpm --dir frontend test:routes
      - name: Typecheck
        run: pnpm --dir frontend typecheck
      - name: Install Playwright Chromium
        run: pnpm --dir frontend exec playwright install --with-deps chromium
      - name: Run accessibility checks
        run: pnpm --dir frontend test:a11y
      - name: Run frontend E2E tests
        run: pnpm --dir frontend test:e2e
      - name: Build production bundle
        run: pnpm --dir frontend build
      - name: Validate route manifest
        run: pnpm --dir frontend test:routes

  contracts:
    name: Local schema and fixture validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install JSON schema validator
        run: python -m pip install jsonschema==4.23.0
      - name: Validate local schemas and fixtures
        run: python .github/scripts/validate_contracts.py
      - name: Test rejected frontend contract states
        run: python .github/scripts/test_contracts.py

  package:
    name: Package frontend delivery artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/MANUS'
    needs: [backend, frontend, contracts]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir frontend build
      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: loop-dynamics-frontend-${{ github.sha }}
          path: frontend/dist
          if-no-files-found: error
          retention-days: 14
