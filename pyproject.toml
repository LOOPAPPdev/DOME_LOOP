[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loop-agentic-rag"
version = "1.0.0"
description = "Offline-first evidence-anchored knowledge base and agentic retrieval pipeline"
requires-python = ">=3.10"
dependencies = ["pymupdf>=1.23"]

[project.optional-dependencies]
vector = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3"]
test = ["pytest>=7", "jsonschema>=4"]
agentic = ["langgraph>=0.2,<1"]

[project.scripts]
loop-rag = "loop_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
